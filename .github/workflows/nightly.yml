name: Nightly AppImage

# Every push to main builds a Linux AppImage and publishes it to the rolling
# "nightly" pre-release, so the latest build always has the same URL:
#   https://github.com/<owner>/<repo>/releases/download/nightly/Adrix-nightly-x86_64.AppImage
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write

# a newer push cancels an older build still in progress
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  appimage:
    runs-on: ubuntu-22.04 # old glibc -> the AppImage runs on most distros
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev patchelf file pkg-config build-essential

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Adminer + static PHP
        run: |
          node scripts/fetch-deps.mjs
          BIN=src-tauri/binaries/php-x86_64-unknown-linux-gnu
          "$BIN" -n -m | tee /tmp/mods
          for m in mysqli pgsql sqlite3 mbstring session openssl; do grep -qx "$m" /tmp/mods || { echo "missing $m"; exit 1; }; done

      - run: pnpm install --frozen-lockfile

      - name: Build AppImage
        run: pnpm tauri build --bundles appimage

      - name: Rename
        id: out
        run: |
          SRC=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          DST=Adrix-nightly-x86_64.AppImage
          cp "$SRC" "$DST"
          echo "file=$DST" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publish to the "nightly" pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # recreate the release so the tag points at this commit
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly "${{ steps.out.outputs.file }}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly (${{ steps.out.outputs.short }})" \
            --notes "Automatic build of \`main\` at ${{ github.sha }}.

          \`\`\`sh
          chmod +x Adrix-nightly-x86_64.AppImage && ./Adrix-nightly-x86_64.AppImage
          \`\`\`

          Some distros need \`libfuse2\` to run AppImages (or use \`--appimage-extract-and-run\`)."

      - uses: actions/upload-artifact@v4
        with:
          name: Adrix-nightly-x86_64.AppImage
          path: ${{ steps.out.outputs.file }}
          retention-days: 14
