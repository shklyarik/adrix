name: Release

# Builds installers:
#   Linux:   AppImage, deb, rpm
#   Windows: msi, nsis (.exe)
# Tag v* -> draft GitHub Release with the files. Manual run -> workflow artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PHP_VERSION: "8.4"
  # minimal extension set for Adminer: MySQL/MariaDB, PostgreSQL, SQLite
  PHP_EXTENSIONS: "ctype,filter,mbstring,mysqlnd,mysqli,pdo,pdo_mysql,pgsql,sqlite3,pdo_sqlite,session,openssl,zlib,tokenizer"

jobs:
  # ── static PHP for Windows is built here: the prebuilt one lacks pgsql ──
  php-windows:
    runs-on: windows-2022
    steps:
      - name: Cache PHP build
        id: cache
        uses: actions/cache@v4
        with:
          path: php-out
          key: php-win-${{ env.PHP_VERSION }}-${{ hashFiles('.github/workflows/release.yml') }}

      - name: Build static PHP (static-php-cli)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force spc | Out-Null
          Set-Location spc
          curl.exe -fsSL -o spc.exe https://dl.static-php.dev/static-php-cli/spc-bin/nightly/spc-windows-x64.exe
          ./spc.exe doctor --auto-fix
          ./spc.exe download --with-php=${{ env.PHP_VERSION }} --for-extensions="${{ env.PHP_EXTENSIONS }}" --prefer-pre-built
          ./spc.exe build "${{ env.PHP_EXTENSIONS }}" --build-cli
          New-Item -ItemType Directory -Force ../php-out | Out-Null
          Copy-Item buildroot/bin/php.exe ../php-out/php.exe

      - name: Verify extensions
        shell: pwsh
        run: |
          $mods = ./php-out/php.exe -n -m
          $mods
          foreach ($m in 'mysqli','pgsql','sqlite3','mbstring','session','openssl') {
            if (-not ($mods -contains $m)) { throw "missing PHP extension: $m" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: php-windows
          path: php-out/php.exe

  build:
    needs: php-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # old glibc -> the AppImage runs on most distros
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev patchelf file pkg-config build-essential

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Windows PHP (from php-windows job)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: php-windows
          path: php-win

      - name: Place PHP sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp php-win/php.exe "src-tauri/binaries/php-${{ matrix.target }}.exe"
            node scripts/fetch-deps.mjs --php=skip
          else
            # Linux: prebuilt "bulk" from dl.static-php.dev (mysqli, pgsql, sqlite3 included)
            node scripts/fetch-deps.mjs
            BIN="src-tauri/binaries/php-${{ matrix.target }}"
            "$BIN" -n -m | tee /tmp/mods
            for m in mysqli pgsql sqlite3 mbstring session openssl; do grep -qx "$m" /tmp/mods || { echo "missing $m"; exit 1; }; done
          fi

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Adrix ${{ github.ref_name }}"
          releaseBody: |
            Linux: `.AppImage` (portable, `chmod +x`), `.deb`, `.rpm`
            Windows: `.msi` or `-setup.exe`
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload bundles (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: adrix-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
