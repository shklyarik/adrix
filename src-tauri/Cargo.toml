[package]
name = "adrix"
version = "0.1.0"
description = "Adminer desktop client with SSH tunnels"
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "adrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
# ring instead of aws-lc-rs: no cmake/nasm needed to build on Windows
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
thiserror = "2"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
